<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小魔鬼闯关 · 儿童版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #header {
            color: #eee;
            margin-bottom: 10px;
            text-align: center;
        }
        #header h1 {
            font-size: 26px;
            letter-spacing: 2px;
            color: #ff6b6b;
            text-shadow: 0 2px 0 #aa2e2e;
        }
        .level-info {
            font-size: 17px;
            color: #ffd93d;
            margin-top: 2px;
            font-weight: 500;
        }
        #timer {
            position: absolute;
            left: 20px;
            top: 20px;
            color: #ffd93d;
            font-size: 18px;
            font-weight: 600;
            background: rgba(0,0,0,0.35);
            padding: 8px 16px;
            border-radius: 20px;
            pointer-events: none;
        }
        canvas {
            border: 4px solid #4a4a6a;
            border-radius: 14px;
            background: #16213e;
            display: block;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            width: 800px;
            height: 500px;
        }
        #footer {
            color: #9a9ab0;
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
            background: rgba(255,255,255,0.04);
            padding: 6px 22px;
            border-radius: 36px;
            backdrop-filter: blur(2px);
        }
        #win-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.82);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            backdrop-filter: blur(6px);
        }
        #win-screen.show {
            display: flex;
        }
        #win-screen h2 {
            font-size: 52px;
            color: #ffd93d;
            margin-bottom: 18px;
            text-shadow: 0 4px 0 #b37b00;
            letter-spacing: 2px;
        }
        #win-screen button {
            padding: 14px 42px;
            font-size: 22px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            margin: 10px;
            font-weight: 600;
            transition: transform 0.15s, background 0.2s;
            box-shadow: 0 6px 0 #aa2e2e;
        }
        #win-screen button:hover {
            background: #ff8787;
            transform: scale(1.03);
        }
        #win-screen button:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #aa2e2e;
        }
        @media (max-width: 840px) {
            canvas { width: 96vw; height: auto; aspect-ratio: 800/500; }
            #header h1 { font-size: 20px; }
            #win-screen h2 { font-size: 34px; }
        }

        /* 排行榜弹窗 */
        #leaderboard-screen, #submit-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            backdrop-filter: blur(6px);
            padding: 20px;
        }
        #leaderboard-screen.show, #submit-screen.show {
            display: flex;
        }
        #leaderboard-screen h2 {
            font-size: 36px;
            color: #ffd93d;
            margin-bottom: 16px;
            text-shadow: 0 3px 0 #b37b00;
        }
        #leaderboard-table {
            border-collapse: collapse;
            width: min(90vw, 560px);
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 18px;
        }
        #leaderboard-table th, #leaderboard-table td {
            padding: 10px 14px;
            text-align: center;
            color: #eee;
            font-size: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        #leaderboard-table th {
            background: rgba(255,217,61,0.18);
            color: #ffd93d;
            font-weight: 700;
        }
        #leaderboard-table tr:nth-child(1) td { color: #ffd93d; font-weight: 700; }
        #leaderboard-table tr:nth-child(2) td { color: #e0e0e0; }
        #leaderboard-table tr:nth-child(3) td { color: #cd7f32; }
        #leaderboard-table tr.me td { background: rgba(126,200,227,0.15); }
        #leaderboard-status {
            color: #9a9ab0;
            font-size: 15px;
            margin-bottom: 12px;
            min-height: 22px;
        }
        #leaderboard-close-btn {
            padding: 10px 36px;
            font-size: 18px;
            background: #4a4a6a;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }
        #leaderboard-close-btn:hover { background: #6a6a8a; }

        /* 提交成绩弹窗 */
        #submit-screen h2 {
            font-size: 38px;
            color: #ffd93d;
            margin-bottom: 14px;
            text-shadow: 0 3px 0 #b37b00;
        }
        #submit-summary {
            color: #fff;
            font-size: 18px;
            margin-bottom: 18px;
            text-align: center;
            line-height: 1.6;
        }
        #submit-name {
            width: min(80vw, 320px);
            padding: 12px 18px;
            font-size: 18px;
            border: 2px solid #ffd93d;
            border-radius: 24px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            text-align: center;
            outline: none;
            margin-bottom: 16px;
        }
        #submit-name:focus {
            border-color: #ff6b6b;
            box-shadow: 0 0 0 3px rgba(255,107,107,0.25);
        }
        #submit-confirm-btn, #submit-cancel-btn {
            padding: 10px 28px;
            font-size: 17px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin: 4px;
            font-weight: 600;
        }
        #submit-confirm-btn {
            background: #ff6b6b;
            color: white;
            box-shadow: 0 4px 0 #aa2e2e;
        }
        #submit-confirm-btn:hover { background: #ff8787; }
        #submit-confirm-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #aa2e2e; }
        #submit-cancel-btn {
            background: #4a4a6a;
            color: #ddd;
        }
        #submit-status {
            margin-top: 14px;
            font-size: 14px;
            min-height: 20px;
        }
        #submit-status.success { color: #7ec8e3; }
        #submit-status.error { color: #ff6b6b; }
    </style>
</head>
<body>
<div id="header">
    <h1>👹 小魔鬼闯关</h1>
    <div class="level-info" id="level-info">第 1 关 / 共 5 关</div>
</div>
<div id="timer">时间：0.00 秒</div>
<button id="leaderboard-btn" style="position:absolute;right:20px;top:20px;padding:8px 18px;font-size:16px;font-weight:600;color:#ffd93d;background:rgba(0,0,0,0.35);border:2px solid #ffd93d;border-radius:20px;cursor:pointer;">🏆 排行榜</button>
<canvas id="game" width="800" height="500"></canvas>
<div id="footer">← → ↑ / WASD 移动 · 空格 / ↑ 跳跃 · 小心尖刺！<button id="music-btn" style="margin-left:14px;padding:4px 12px;border:1px solid #ffd93d;background:rgba(255,217,61,0.15);color:#ffd93d;border-radius:14px;cursor:pointer;font-size:13px;">🔊 音乐</button></div>

<!-- 版本 / 调试信息面板 -->
<div id="version-info" style="
    position: fixed;
    bottom: 4px;
    right: 8px;
    font-size: 11px;
    color: #6a6a8a;
    background: rgba(0,0,0,0.5);
    padding: 4px 10px;
    border-radius: 10px;
    font-family: 'Consolas', 'Monaco', monospace;
    line-height: 1.5;
    z-index: 100;
    pointer-events: none;
    user-select: text;
">v3.2 · SDK 检测中…</div>

<div id="win-screen">
    <h2 id="win-text">🎉 全部通关！</h2>
    <div id="win-time" style="font-size:24px;color:#fff;margin-bottom:8px;">通关时间：0.00 秒</div>
    <div id="win-best" style="font-size:20px;color:#ffd93d;margin-bottom:8px;">最快成绩：--</div>
    <div id="win-compare" style="font-size:18px;color:#7ec8e3;margin-bottom:12px;"></div>
    <div id="win-deaths" style="font-size:20px;color:#ff6b6b;margin-bottom:8px;display:none;">死亡次数：0 次</div>
    <div id="win-best-deaths" style="font-size:18px;color:#ffd93d;margin-bottom:8px;display:none;">最少死亡：--</div>
    <div id="win-deaths-compare" style="font-size:16px;color:#7ec8e3;margin-bottom:16px;display:none;"></div>
    <button id="restart-btn">🔄 重新冒险</button>
</div>

<!-- 排行榜弹窗 -->
<div id="leaderboard-screen">
    <h2>🏆 全球排行榜 Top 10</h2>
    <div id="leaderboard-status">加载中...</div>
    <table id="leaderboard-table">
        <thead>
            <tr><th>排名</th><th>姓名</th><th>时间</th><th>日期</th></tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
    </table>
    <button id="leaderboard-close-btn">关闭</button>
</div>

<!-- 提交成绩弹窗 -->
<div id="submit-screen">
    <h2>🎉 恭喜通关！</h2>
    <div id="submit-summary"></div>
    <input type="text" id="submit-name" maxlength="20" placeholder="输入你的姓名/昵称" />
    <div>
        <button id="submit-confirm-btn">📤 提交成绩</button>
        <button id="submit-cancel-btn">跳过</button>
    </div>
    <div id="submit-status"></div>
</div>

<!-- CloudBase Web SDK v3（新版：PostgreSQL 模式） -->
<script src="https://static.cloudbase.net/cloudbase-js-sdk/3.1.1/cloudbase.full.js"></script>

<script>
    (function(){
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const W = canvas.width, H = canvas.height;
        const GRAVITY = 0.6;
        // ===== 版本号：每次修改文件请同步改这里 =====
        const BUILD_VERSION = "v3.2 · 2026-08-31 · CloudBase PG 接入 + 调试面板";
        let currentLevel = 0, deathCount = 0, gameWon = false;
        let keys = {};
        let player, platforms, spikes, movingPlatforms, door;
        // ===== 训练模式：true=只玩第5关循环特训；false=正常全5关通关 =====
        // 默认开启，方便第5关特训。按 T 键切换并刷新页面恢复/进入训练模式。
        let trainingMode = localStorage.getItem("levelDevilTrainMode") === "1";
        let debugFrame = 0; // 调试用帧计数
        let prevOnMoving = null; // 上一帧所在的移动平台索引
        let startTime = Date.now();
        let pauseStartedAt = 0; // 进入死亡/倒计时的时刻
        let totalTime = 0;
        let timerRunning = true;
        let bestTime = parseFloat(localStorage.getItem("levelDevilBestTime")) || Infinity;
        let bestDeaths = parseInt(localStorage.getItem("levelDevilBestDeaths")) || Infinity;

        // 幻影拖尾配置
        const PHANTOM = {
            enabled: true,
            interval: 1,         // 每隔多少帧生成一个幻影（数值越小越密）
            maxCount: 28,        // 最多保留的幻影数量
            fadeStep: 0.05,      // 每帧透明度衰减
            minAlpha: 0.05,      // 低于此透明度则不再绘制
            startAlpha: 0.85,    // 新生幻影的初始透明度
            moveThreshold: 0.2,  // 横向速度超过此值才生成幻影（静止时无幻影）
            jumpThreshold: 0.3   // 纵向速度绝对值超过此值才生成跳跃幻影
        };
        let phantomTrail = [];
        let phantomFrame = 0;

        // ----- 背景音乐 (Web Audio API 合成近似超级玛丽主题曲) -----
        let audioCtx = null;
        let musicEnabled = true;
        let musicTimer = null;
        let musicStep = 0;
        const MASTER_GAIN = 0.12;

        // 频率表 (Hz)
        const NOTE = {
            C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
            C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00,
            C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.00, A3: 220.00,
            REST: 0
        };
        // 超级玛丽主题曲 (简化片段，循环播放)
        // 0 = 休止符
        const MELODY = [
            // 第一段
            [NOTE.E5,8],[NOTE.E5,8],[NOTE.REST,8],[NOTE.E5,8],[NOTE.REST,8],[NOTE.C5,8],[NOTE.E5,8],[NOTE.REST,8],
            [NOTE.G5,16],[NOTE.REST,16],[NOTE.G4,16],[NOTE.REST,16],
            [NOTE.C5,16],[NOTE.REST,8],[NOTE.G4,16],[NOTE.REST,8],[NOTE.E4,16],[NOTE.REST,8],
            [NOTE.A4,8],[NOTE.B4,8],[NOTE.REST,8],[NOTE.A4,8],[NOTE.REST,8],[NOTE.A4*Math.pow(2,1/12),8],[NOTE.A4,8],
            [NOTE.G4,12],[NOTE.E5,12],[NOTE.G5,12],[NOTE.A5,4],[NOTE.REST,4],
            [NOTE.F5,8],[NOTE.G5,8],[NOTE.REST,8],[NOTE.E5,8],[NOTE.REST,8],[NOTE.C5,8],[NOTE.D5,8],[NOTE.B4,8],
            // 第二段
            [NOTE.C5,8],[NOTE.REST,8],[NOTE.G4,8],[NOTE.REST,8],[NOTE.E4,8],[NOTE.REST,8],
            [NOTE.A4,8],[NOTE.B4,8],[NOTE.REST,8],[NOTE.A4,8],[NOTE.REST,8],[NOTE.G4,8],[NOTE.E5,8],
            [NOTE.G5,8],[NOTE.A5,4],[NOTE.REST,4],[NOTE.F5,8],[NOTE.G5,8],[NOTE.REST,8],[NOTE.E5,8],[NOTE.REST,8],
            [NOTE.C5,8],[NOTE.D5,8],[NOTE.B4,8],[NOTE.REST,8],
            // 第三段（重复变奏）
            [NOTE.C5,8],[NOTE.REST,8],[NOTE.G4,8],[NOTE.REST,8],[NOTE.E4,8],[NOTE.REST,8],
            [NOTE.A4,8],[NOTE.B4,8],[NOTE.REST,8],[NOTE.A4,8],[NOTE.REST,8],[NOTE.G4,8],[NOTE.E5,8],
            [NOTE.G5,8],[NOTE.A5,4],[NOTE.REST,4],[NOTE.F5,8],[NOTE.G5,8],[NOTE.REST,8],[NOTE.E5,8],[NOTE.REST,8],
            [NOTE.C5,8],[NOTE.D5,8],[NOTE.B4,8],[NOTE.REST,8]
        ];
        const BASS = [
            [NOTE.C3,16],[NOTE.REST,16],[NOTE.G3,16],[NOTE.REST,16],[NOTE.C3,16],[NOTE.REST,16],[NOTE.G3,16],[NOTE.REST,16],
            [NOTE.A3,16],[NOTE.REST,16],[NOTE.E3,16],[NOTE.REST,16],[NOTE.A3,16],[NOTE.REST,16],[NOTE.E3,16],[NOTE.REST,16],
            [NOTE.F3,16],[NOTE.REST,16],[NOTE.C3,16],[NOTE.REST,16],[NOTE.F3,16],[NOTE.REST,16],[NOTE.C3,16],[NOTE.REST,16],
            [NOTE.G3,16],[NOTE.REST,16],[NOTE.D3,16],[NOTE.REST,16],[NOTE.G3,16],[NOTE.REST,16],[NOTE.D3,16],[NOTE.REST,16]
        ];

        function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                console.warn("Web Audio API 不可用", e);
                musicEnabled = false;
            }
        }

        function playNote(freq, durationMs, type, gain) {
            if (!audioCtx || !musicEnabled || freq === NOTE.REST) return;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = type || "square";
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            g.gain.setValueAtTime(0, audioCtx.currentTime);
            g.gain.linearRampToValueAtTime((gain || 0.18) * MASTER_GAIN, audioCtx.currentTime + 0.01);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durationMs / 1000);
            osc.connect(g).connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + durationMs / 1000 + 0.05);
        }

        // ----- 音效 (8-bit 风格短音) -----
        // 音效在 background music 关闭时仍然播放（不受 musicEnabled 控制）
        function sfxJump() {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = "square";
            // 跳跃：快速上升的滑音 (从 ~520Hz 升到 ~1200Hz)
            osc.frequency.setValueAtTime(520, t);
            osc.frequency.exponentialRampToValueAtTime(1200, t + 0.12);
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(0.22 * MASTER_GAIN, t + 0.01);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
            osc.connect(g).connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.2);
        }

        function sfxDeath() {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            // 死亡：两段下滑的"咚咚"声
            [0, 0.18].forEach((delay, i) => {
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = "square";
                osc.frequency.setValueAtTime(i === 0 ? 440 : 330, t + delay);
                osc.frequency.exponentialRampToValueAtTime(i === 0 ? 220 : 110, t + delay + 0.18);
                g.gain.setValueAtTime(0, t + delay);
                g.gain.linearRampToValueAtTime(0.28 * MASTER_GAIN, t + delay + 0.01);
                g.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.2);
                osc.connect(g).connect(audioCtx.destination);
                osc.start(t + delay);
                osc.stop(t + delay + 0.22);
            });
        }

        function sfxCoin() {  // 收集小奖励的清脆"叮"声（备用）
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            [988, 1319].forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = "square";
                osc.frequency.setValueAtTime(freq, t + i * 0.06);
                g.gain.setValueAtTime(0, t + i * 0.06);
                g.gain.linearRampToValueAtTime(0.18 * MASTER_GAIN, t + i * 0.06 + 0.005);
                g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.06 + 0.08);
                osc.connect(g).connect(audioCtx.destination);
                osc.start(t + i * 0.06);
                osc.stop(t + i * 0.06 + 0.1);
            });
        }

        function sfxWin() {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            // 通关：欢快的上行音阶 (C5→E5→G5→C6)，每音约 80ms
            const notes = [523.25, 659.25, 783.99, 1046.5];
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = "square";
                osc.frequency.setValueAtTime(freq, t + i * 0.1);
                g.gain.setValueAtTime(0, t + i * 0.1);
                g.gain.linearRampToValueAtTime(0.25 * MASTER_GAIN, t + i * 0.1 + 0.01);
                g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.18);
                osc.connect(g).connect(audioCtx.destination);
                osc.start(t + i * 0.1);
                osc.stop(t + i * 0.1 + 0.2);
            });
            // 末尾再来一个长持续的高音庆祝
            const lastOsc = audioCtx.createOscillator();
            const lastG = audioCtx.createGain();
            lastOsc.type = "square";
            lastOsc.frequency.setValueAtTime(1046.5, t + 0.4);
            lastG.gain.setValueAtTime(0, t + 0.4);
            lastG.gain.linearRampToValueAtTime(0.25 * MASTER_GAIN, t + 0.42);
            lastG.gain.exponentialRampToValueAtTime(0.001, t + 0.95);
            lastOsc.connect(lastG).connect(audioCtx.destination);
            lastOsc.start(t + 0.4);
            lastOsc.stop(t + 1.0);
        }

        function sfxLand() {  // 落地轻响（备用）
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = "square";
            osc.frequency.setValueAtTime(220, t);
            osc.frequency.exponentialRampToValueAtTime(110, t + 0.06);
            g.gain.setValueAtTime(0.15 * MASTER_GAIN, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
            osc.connect(g).connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.08);
        }

        function musicStepRunner() {
            if (!musicEnabled || !audioCtx) return;
            // 主旋律
            const m = MELODY[musicStep % MELODY.length];
            playNote(m[0], (m[1] / 16) * 480, "square", 0.22);
            // 低音
            const b = BASS[musicStep % BASS.length];
            playNote(b[0], (b[1] / 16) * 480, "triangle", 0.35);
            musicStep++;
        }

        function startMusic() {
            initAudio();
            if (!audioCtx) return;
            if (audioCtx.state === "suspended") audioCtx.resume();
            if (musicTimer) return;
            // 每 30ms 推进一拍 (16分音符 = 480ms / 16 ≈ 30ms)
            musicTimer = setInterval(musicStepRunner, 120);
        }

        function stopMusic() {
            if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
        }

        function toggleMusic() {
            musicEnabled = !musicEnabled;
            const btn = document.getElementById("music-btn");
            if (btn) btn.textContent = musicEnabled ? "🔊 音乐" : "🔇 静音";

const CB_CONFIG = {
    env: "score-d4g9z7s3z872dc385"
};

// CloudBase 全局初始化（懒加载）
let _cbApp  = null;
let _cbAuth = null;
let _cbDb   = null;

async function getCloudBase() {
    if (_cbApp) return { app: _cbApp, auth: _cbAuth, db: _cbDb };
    if (!window.cloudbase) {
        throw new Error("CloudBase SDK 未加载，请检查网络或刷新页面");
    }
    if (!CB_CONFIG.env || CB_CONFIG.env.startsWith("你的")) {
        throw new Error("请先在 CB_CONFIG 中填入你的 CloudBase 环境 ID");
    }
    _cbApp  = cloudbase.init({ env: CB_CONFIG.env });
    _cbAuth = _cbApp.auth();
    _cbDb   = _cbApp.rdb();   // PostgreSQL 关系型数据库
    // 匿名登录（必须）
    try {
        const res = await _cbAuth.signInAnonymously();
        if (res && res.error) throw res.error;
        console.log("✅ CloudBase 匿名登录成功");
    } catch (e) {
        const msg = (e && e.message) || String(e);
        throw new Error(
            "匿名登录失败：" + msg +
            "\n请确认：1) 用户管理 → 登录方式 → 启用「匿名登录」"
        );
    }
    return { app: _cbApp, auth: _cbAuth, db: _cbDb };
}

async function submitScoreToLeaderboard(name, time) {
    const { db } = await getCloudBase();
    // time 是浮点秒数，score 字段定义为 INTEGER
    // 将秒数四舍五入为整数毫秒×N（或直接取秒×1000），便于整数存储与排序
    // 为了简单：score 直接存"完成时间（秒，保留 2 位小数转成整数毫秒）"
    const score = Math.round(parseFloat(time) * 100); // 12.34 秒 → 1234
    const { data, error } = await db.from("leaderboard").insert({
        player_name: String(name).slice(0, 20) || "anonymous",
        score: score
    });
    if (error) {
        const msg = (error.message || "").toLowerCase();
        if (msg.includes("relation") || msg.includes("does not exist")) {
            throw new Error("表 leaderboard 不存在。请在 CloudBase PG 中执行建表 SQL。");
        }
        if (msg.includes("policy") || msg.includes("permission") || msg.includes("denied")) {
            throw new Error("数据库权限不足。请执行 GRANT 和 RLS 策略（见代码注释）。");
        }
        throw new Error("保存失败：" + (error.message || JSON.stringify(error)));
    }
    return data;
}

async function fetchLeaderboard() {
    const { db } = await getCloudBase();
    const { data, error } = await db.from("leaderboard")
        .select("*")
        .order("score", { ascending: true })   // 时间越短 → score 越小 → 排前面
        .limit(10);
    if (error) {
        const msg = (error.message || "").toLowerCase();
        if (msg.includes("relation") || msg.includes("does not exist")) {
            throw new Error("表 leaderboard 不存在。请在 CloudBase PG 中执行建表 SQL。");
        }
        throw new Error("读取失败：" + (error.message || JSON.stringify(error)));
    }
    return (data || []).map(row => ({
        name: row.player_name || "anonymous",
        time: (parseInt(row.score) || 0) / 100, // 反算回秒（保留 2 位小数）
        date: row.created_at || ""
    }));
}

        function updateTimerDisplay() {
            const bestLabel = bestTime === Infinity ? "--" : bestTime.toFixed(2);
            document.getElementById("timer").textContent = "时间：" + totalTime.toFixed(2) + " 秒 | 最快：" + bestLabel + " 秒";
        }

        let respawnTimer = 0;
        const RESPAWN_DELAY_FRAMES = 60; // 死亡后 1 秒暗影
        let countdownTimer = 0;
        const COUNTDOWN_FRAMES = 180; // 屏幕中心 3 秒倒计时

        function respawn() {
            if (!player.alive) return; // 防止重复触发
            // 记录进入死亡的时刻，之后重生时把这段空窗从计时中扣除
            pauseStartedAt = Date.now();
            sfxDeath(); // 死亡音效
            player.alive = false;
            respawnTimer = RESPAWN_DELAY_FRAMES;
            countdownTimer = 0; // 还没进入倒计时阶段
        }

        function performRespawn() {
            // 把死亡期间的空窗补偿回 startTime，使计时器不包含这段时间
            if (pauseStartedAt > 0) {
                startTime += Date.now() - pauseStartedAt;
                pauseStartedAt = 0;
            }
            const L = levels[currentLevel];
            player.x = L.start.x;
            player.y = L.start.y;
            player.vx = 0;
            player.vy = 0;
            player.alive = true;
            player.onGround = false;
            player.onMoving = null;
            deathCount++;
            updateTimerDisplay();
            // 死亡不重置总计时
            platforms.forEach(pl => {
                if (pl.disappeared) {
                    pl.disappeared = false;
                    pl.disappearTimer = 0;
                }
            });
        }

        function collides(a, b) {
            return a.x < b.x + b.w &&
                   a.x + a.w > b.x &&
                   a.y < b.y + b.h &&
                   a.y + a.h > b.y;
        }

        // ----- 更新逻辑 (核心修复) -----
        function update(dt) {
            if (gameWon) return;
            // 速度/重力按"每像素/秒"和"每像素/秒²"换算
            const dtScale = dt * 60; // 60fps 下为 1.0

            const left  = keys["ArrowLeft"] || keys["KeyA"];
            const right = keys["ArrowRight"] || keys["KeyD"];
            const jump  = keys["Space"] || keys["ArrowUp"] || keys["KeyW"];

            if (left) {
                player.vx = -4.2;
                player.facing = -1;
            } else if (right) {
                player.vx = 4.2;
                player.facing = 1;
            } else {
                player.vx *= 0.68;
            }

            // 记录移动平台旧位置并更新平台
            const mpOldX = movingPlatforms.map(mp => mp.currentX);
            const mpOldY = movingPlatforms.map(mp => mp.currentY);

            for (const mp of movingPlatforms) {
                if (mp.dx) {
                    mp.currentX += mp.dx * mp.dir * dtScale;
                    mp.x = mp.currentX; // 同步碰撞用坐标
                    if (mp.currentX <= mp.minX || mp.currentX >= mp.maxX) mp.dir *= -1;
                }
                if (mp.dy) {
                    mp.currentY += mp.dy * mp.dir * dtScale;
                    mp.y = mp.currentY; // 同步碰撞用坐标
                    if (mp.currentY <= mp.minY || mp.currentY >= mp.maxY) mp.dir *= -1;
                }
            }

            // 先让玩家跟随当前站立的移动平台移动，再施加重力和输入
            let carryDx = 0, carryDy = 0;
            if (player.onMoving !== null && player.onMoving < movingPlatforms.length) {
                const mp = movingPlatforms[player.onMoving];
                carryDx = mp.currentX - mpOldX[player.onMoving];
                carryDy = mp.currentY - mpOldY[player.onMoving];
                player.x += carryDx;
                player.y += carryDy;
            }

            if (jump && player.onGround) {
                player.vy = -11.8;
                player.onGround = false;
                player.onMoving = null; // 跳跃时立即脱离平台
                sfxJump(); // 跳跃音效
            }

            // 重力按"每像素/秒²"换算
            player.vy += GRAVITY * dtScale;
            if (player.vy > 12) player.vy = 12;

            // ---- X轴碰撞：只与静态平台做左右推开，避免移动平台把玩家顶下去 ----
            player.x += player.vx * dtScale;
            if (player.x < 0) player.x = 0;
            if (player.x + player.w > W) player.x = W - player.w;

            for (const pl of platforms) {
                if (pl.disappeared) continue;
                if (collides(player, pl)) {
                    if (player.vx > 0) {
                        player.x = pl.x - player.w;
                    } else if (player.vx < 0) {
                        player.x = pl.x + pl.w;
                    }
                    player.vx = 0;
                }
            }

            // ---- Y轴碰撞 ----
            player.y += player.vy * dtScale;
            player.onGround = false;
            player.onMoving = null;

            const allPlats = [...platforms, ...movingPlatforms];
            for (const pl of allPlats) {
                if (pl.disappeared) continue;
                if (collides(player, pl)) {
                    if (player.vy > 0) {
                        player.y = pl.y - player.h;
                        player.vy = 0;
                        player.onGround = true;
                        const mpIdx = movingPlatforms.indexOf(pl);
                        if (mpIdx !== -1) player.onMoving = mpIdx;

                        if (pl.trigger && !pl.disappeared) {
                            pl.disappearTimer++;
                            if (pl.disappearTimer > 40) {
                                pl.disappeared = true;
                            }
                        }
                    } else if (player.vy < 0) {
                        player.y = pl.y + pl.h;
                        player.vy = 0;
                    }
                }
            }

            // ---- 更新计时器（只统计玩家活着的真实游玩时间） ----
            if (timerRunning && player.alive) {
                totalTime = (Date.now() - startTime) / 1000;
                updateTimerDisplay();
            }

            // ---- 更新幻影拖尾 ----
            updatePhantoms();

            // ---- 调试日志（第三关，仅记录状态变化） ----
            debugFrame++;
            if (currentLevel === 2 && player.onMoving !== prevOnMoving) {
                const mp0 = movingPlatforms[0];
                const mp1 = movingPlatforms[1];
                console.log(JSON.stringify({
                    f: debugFrame,
                    event: player.onMoving === null ? "left platform" : "landed platform " + player.onMoving,
                    px: +player.x.toFixed(2),
                    py: +player.y.toFixed(2),
                    vx: +player.vx.toFixed(2),
                    vy: +player.vy.toFixed(2),
                    og: player.onGround,
                    mp0: mp0 ? {x:+mp0.currentX.toFixed(1), y:+mp0.currentY.toFixed(1)} : null,
                    mp1: mp1 ? {x:+mp1.currentX.toFixed(1), y:+mp1.currentY.toFixed(1)} : null
                }));
                prevOnMoving = player.onMoving;
            }

            // ---- 死亡条件 ----
            if (player.alive && (player.y > H + 40 || spikes.some(s => collides(player, s)))) {
                if (currentLevel === 2) console.log("L3 DEATH");
                respawn();
                return;
            }

            // ---- 复活流程：死亡 → 1秒暗影 → 3秒中心倒计时（锁定输入）→ 真正重生 ----
            if (!player.alive) {
                if (respawnTimer > 0) {
                    respawnTimer--;
                    return;
                }
                // 启动中心倒计时
                if (countdownTimer === 0) {
                    countdownTimer = COUNTDOWN_FRAMES;
                }
                countdownTimer--;
                if (countdownTimer > 0) {
                    return; // 倒计时期间锁定所有操作
                }
                // 倒计时结束，执行真正重生
                performRespawn();
                countdownTimer = 0;
            }

            // ---- 到达门 ----
            if (collides(player, door)) {
                // 训练模式下通关后重新进入第5关循环特训
                if (trainingMode) {
                    deathCount = 0;
                    countdownTimer = 0;
                    startTime = Date.now();
                    totalTime = 0;
                    timerRunning = true;
                    loadLevel(4);
                } else {
                    loadLevel(currentLevel + 1);
                }
                return;
            }
        }

        // ----- 幻影拖尾 -----
        function updatePhantoms() {
            if (!PHANTOM.enabled || !player.alive) {
                phantomTrail.length = 0;
                return;
            }
            // 衰减所有幻影的透明度
            for (const p of phantomTrail) {
                p.alpha -= PHANTOM.fadeStep;
            }
            // 移除已经淡出或超出上限的幻影
            phantomTrail = phantomTrail.filter(p => p.alpha > PHANTOM.minAlpha);
            while (phantomTrail.length > PHANTOM.maxCount) phantomTrail.shift();

            phantomFrame++;
            // 当横向移动较快或处于跳跃/下落时，间隔生成幻影
            const moving = Math.abs(player.vx) > PHANTOM.moveThreshold;
            const inAir = Math.abs(player.vy) > PHANTOM.jumpThreshold;
            if ((moving || inAir) && phantomFrame >= PHANTOM.interval) {
                phantomFrame = 0;
                phantomTrail.push({
                    x: player.x,
                    y: player.y,
                    w: player.w,
                    h: player.h,
                    facing: player.facing,
                    alpha: PHANTOM.startAlpha
                });
            }
        }

        function drawPhantoms() {
            if (!PHANTOM.enabled || phantomTrail.length === 0) return;
            for (const p of phantomTrail) {
                const a = Math.max(p.alpha, 0);
                ctx.fillStyle = "rgba(230,57,70," + a.toFixed(3) + ")";
                ctx.fillRect(p.x, p.y, p.w, p.h);
                // 淡淡的角
                ctx.fillStyle = "rgba(255,217,61," + (a * 0.6).toFixed(3) + ")";
                ctx.beginPath();
                ctx.moveTo(p.x + 5, p.y);
                ctx.lineTo(p.x + 10, p.y - 10);
                ctx.lineTo(p.x + 15, p.y);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(p.x + p.w - 15, p.y);
                ctx.lineTo(p.x + p.w - 10, p.y - 10);
                ctx.lineTo(p.x + p.w - 5, p.y);
                ctx.fill();
            }
        }

        // ----- 绘制 (无改动，保持原有风格) -----
        function draw() {
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, "#16213e");
            grad.addColorStop(1, "#0f3460");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            ctx.fillStyle = "rgba(255,255,240,0.06)";
            for (let i=0; i<50; i++) {
                if (i%2===0) continue;
                ctx.beginPath();
                ctx.arc( (i*23+7)%W, (i*13+11)%H, 1.5, 0, Math.PI*2);
                ctx.fill();
            }

            for (const p of platforms) {
                if (p.disappeared) continue;
                ctx.globalAlpha = p.disappearTimer > 0 ? 1 - p.disappearTimer/40 : 1;
                ctx.fillStyle = "#3d6a7a";
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.fillStyle = "#7ec8e3";
                ctx.fillRect(p.x, p.y, p.w, 5);
                ctx.globalAlpha = 1;
            }

            for (const mp of movingPlatforms) {
                ctx.fillStyle = "#f5b042";
                ctx.shadowColor = "#ffd966";
                ctx.shadowBlur = 12;
                ctx.fillRect(mp.currentX, mp.currentY, mp.w, mp.h);
                ctx.fillStyle = "#ffea9e";
                ctx.fillRect(mp.currentX, mp.currentY, mp.w, 5);
                ctx.shadowBlur = 0;
            }

            for (const s of spikes) {
                ctx.fillStyle = "#ff4757";
                const count = Math.floor(s.w / 14);
                for (let i = 0; i < count; i++) {
                    const tx = s.x + i * 14;
                    ctx.beginPath();
                    ctx.moveTo(tx, s.y + s.h);
                    ctx.lineTo(tx + 7, s.y);
                    ctx.lineTo(tx + 14, s.y + s.h);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.fillStyle = "#c0392b";
                ctx.fillRect(s.x, s.y + s.h - 3, s.w, 3);
            }

            ctx.fillStyle = "#6d4c41";
            ctx.fillRect(door.x, door.y, door.w, door.h);
            ctx.fillStyle = "#f5cd7a";
            ctx.fillRect(door.x + 5, door.y + 6, door.w - 10, door.h - 12);
            ctx.fillStyle = "#f39c12";
            ctx.beginPath();
            ctx.arc(door.x + door.w - 12, door.y + door.h/2, 5, 0, Math.PI*2);
            ctx.fill();

            drawPhantoms();

            if (player.alive || respawnTimer > 0) {
                const px = player.x, py = player.y;
                // 死亡倒计时中玩家变暗
                if (!player.alive) {
                    ctx.globalAlpha = 0.35;
                }
                ctx.fillStyle = "#e63946";
                ctx.shadowColor = "#ff6b6b";
                ctx.shadowBlur = 12;
                ctx.fillRect(px, py, player.w, player.h);
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#ffffff";
                const eyeOff = player.facing > 0 ? 18 : 4;
                ctx.beginPath();
                ctx.arc(px + eyeOff, py + 10, 5, 0, Math.PI*2);
                ctx.arc(px + eyeOff + (player.facing>0? 8 : -8), py + 10, 5, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#1a1a2e";
                ctx.beginPath();
                ctx.arc(px + eyeOff + player.facing*2, py + 10, 2.2, 0, Math.PI*2);
                ctx.arc(px + eyeOff + (player.facing>0? 8 : -8) + player.facing*2, py + 10, 2.2, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#ffd93d";
                ctx.beginPath();
                ctx.moveTo(px + 5, py);
                ctx.lineTo(px + 10, py - 10);
                ctx.lineTo(px + 15, py);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(px + player.w - 15, py);
                ctx.lineTo(px + player.w - 10, py - 10);
                ctx.lineTo(px + player.w - 5, py);
                ctx.fill();
                ctx.globalAlpha = 1;
            }

            // ---- 屏幕中心倒计时遮罩 ----
            if (countdownTimer > 0) {
                const sec = Math.ceil(countdownTimer / 60);
                // 半透明黑色遮罩
                ctx.fillStyle = "rgba(0,0,0,0.55)";
                ctx.fillRect(0, 0, W, H);

                // 圆形背景
                const cx = W / 2, cy = H / 2;
                const r = 90;
                ctx.fillStyle = "rgba(26,26,46,0.95)";
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#ffd93d";
                ctx.lineWidth = 5;
                ctx.stroke();

                // 提示文字
                ctx.fillStyle = "#ffd93d";
                ctx.font = "bold 22px Segoe UI, sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("即将重生", cx, cy - 50);

                // 大号数字
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 80px Segoe UI, sans-serif";
                ctx.fillText(sec.toString(), cx, cy + 5);

                // 副标题
                ctx.fillStyle = "#9a9ab0";
                ctx.font = "16px Segoe UI, sans-serif";
                ctx.fillText("请稍候...", cx, cy + 60);
            }
        }

        // 帧率无关的固定时间步长
        const FIXED_DT = 1 / 60; // 60fps 基准
        let lastTime = performance.now();
        let accumulator = 0;
        const MAX_DT = 0.1; // 防止标签页切回后大跳

        function loop(currentTime) {
            if (currentTime === undefined) currentTime = performance.now();
            let frameDt = (currentTime - lastTime) / 1000;
            lastTime = currentTime;
            if (frameDt > MAX_DT) frameDt = MAX_DT;
            accumulator += frameDt;

            // 固定步长物理更新
            while (accumulator >= FIXED_DT) {
                update(FIXED_DT);
                accumulator -= FIXED_DT;
            }
            draw();
            requestAnimationFrame(loop);
        }

        document.getElementById("music-btn").addEventListener("click", toggleMusic);

        // 用户首次按键时启动音乐（浏览器自动播放策略要求）
        function tryStartMusic() {
            startMusic();
            window.removeEventListener("keydown", tryStartMusic);
            document.removeEventListener("click", tryStartMusic);
        }
        window.addEventListener("keydown", tryStartMusic, { once: true });
        document.addEventListener("click", tryStartMusic, { once: true });

        document.getElementById("restart-btn").addEventListener("click", function() {
            document.getElementById("win-screen").classList.remove("show");
            deathCount = 0;
            countdownTimer = 0;
            startTime = Date.now();
            totalTime = 0;
            timerRunning = true;
            loadLevel(trainingMode ? 4 : 0);
        });

        // 排行榜相关按钮
        document.getElementById("leaderboard-btn").addEventListener("click", openLeaderboard);
        document.getElementById("leaderboard-close-btn").addEventListener("click", closeLeaderboard);
        document.getElementById("submit-confirm-btn").addEventListener("click", confirmSubmit);
        document.getElementById("submit-cancel-btn").addEventListener("click", closeSubmitScreen);
        document.getElementById("submit-name").addEventListener("keydown", e => {
            if (e.key === "Enter") confirmSubmit();
        });

        loadLevel(trainingMode ? 4 : 0);
        loop();

        // ===== 版本/SDK 检测 =====
        (function showVersionInfo() {
            const el = document.getElementById("version-info");
            if (!el) return;
            const sdkLoaded = typeof window.cloudbase !== "undefined";
            const sdkVer = (window.cloudbase && (cloudbase.SDK_NAME || cloudbase.version)) || "未知";
            const cfgOk = (typeof CB_CONFIG !== "undefined") && CB_CONFIG.env && !CB_CONFIG.env.startsWith("你的");
            // 检测 script 标签加载情况
            const scriptTag = document.querySelector('script[src*="cloudbase"]');
            const scriptSrc = scriptTag ? scriptTag.src : "未找到";
            el.innerHTML =
                `v3.1 · SDK ${sdkLoaded ? "✅ 已加载" : "❌ 未加载"} (${sdkVer})<br>` +
                `CDN: <span style="color:#9a9ab0;">${scriptSrc}</span><br>` +
                `env: ${cfgOk ? "✅ 已配置" : "❌ 未配置"}`;
            el.style.color = sdkLoaded && cfgOk ? "#7ec8e3" : "#ff6b6b";
        })();
    })();
</script>
</body>
</html>
